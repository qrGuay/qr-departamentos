<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Departamentos</title>

<style>
body {
font-family: Arial, sans-serif;
margin: 0;
background: #f4f4f4;
color: #222;
}

header {
background: #1f2937;
color: white;
padding: 25px 20px;
text-align: center;
}

main {
max-width: 700px;
margin: 20px auto;
padding: 0 15px;
}

.card {
background: white;
border-radius: 12px;
padding: 20px;
margin-bottom: 20px;
box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

textarea,
input {
width: 100%;
box-sizing: border-box;
padding: 12px;
margin-top: 8px;
margin-bottom: 12px;
border: 1px solid #ccc;
border-radius: 8px;
font-size: 16px;
}

textarea {
min-height: 100px;
resize: vertical;
}

button {
width: 100%;
padding: 14px;
border: none;
border-radius: 8px;
background: #2563eb;
color: white;
font-size: 16px;
font-weight: bold;
}

button:active {
transform: scale(0.98);
}

.post {
border-top: 1px solid #ddd;
padding-top: 15px;
margin-top: 15px;
}

.date {
font-size: 12px;
color: #777;
}
</style>
</head>

<body>

<header>
<h1> 🏢QR Departamentos</h1>
<p>Tablón de Administración</p>
</header>

<main>

<div class="card">
<h2> 📝Nueva publicación</h2>

<label>Tu nombre</label>
<input type="text" id="author" placeholder="Escribe tu nombre">

<label>Comentario</label>
<textarea id="content" placeholder="Escribe aquí tu comentario..."></textarea>

<button onclick="publicar()">
PUBLICAR
</button>
</div>

<div class="card">
<h2>📋 Publicaciones</h2>

<div id="posts">
Todavía no hay publicaciones.
</div>

</div>

</main>

<script>
function publicar() {

const nombre = document.getElementById("author").value;
const comentario = document.getElementById("content").value;

if (!comentario.trim()) {
alert("Escribe un comentario.");
return;
}

const publicaciones = document.getElementById("posts");

const nueva = document.createElement("div");
nueva.className = "post";

nueva.innerHTML = `
<strong>${nombre || "Anónimo"}</strong>
<p>${comentario}</p>
<div class="date">
Publicado ahora
</div>
`;

publicaciones.prepend(nueva);

document.getElementById("author").value = "";
document.getElementById("content").value = "";
}
</script>

</body>
</html>
