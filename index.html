<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Departamentos</title>

<style>
body {
font-family: Arial, sans-serif;
margin: 0;
background: #f4f4f4;
color: #222;
}

header {
background: #1f2937;
color: white;
padding: 25px 20px;
text-align: center;
}

main {
max-width: 700px;
margin: 20px auto;
padding: 0 15px;
}

.card {
background: white;
border-radius: 12px;
padding: 20px;
margin-bottom: 20px;
box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

input, textarea {
width: 100%;
box-sizing: border-box;
padding: 12px;
margin-top: 8px;
margin-bottom: 12px;
border: 1px solid #ccc;
border-radius: 8px;
font-size: 16px;
}

textarea {
min-height: 100px;
}

button {
width: 100%;
padding: 14px;
border: none;
border-radius: 8px;
background: #2563eb;
color: white;
font-size: 16px;
font-weight: bold;
cursor: pointer;
}

.post {
border-top: 1px solid #ddd;
padding-top: 15px;
margin-top: 15px;
}

.date {
font-size: 12px;
color: #777;
}

#mensaje {
margin-top: 10px;
font-weight: bold;
}
</style>
</head>

<body>

<header>
<h1>🏢 QR Departamentos</h1>
<p>Tablón de Administración</p>
</header>

<main>

<div class="card">

<h2>📝 Nueva publicación</h2>

<label>Tu nombre</label>
<input
type="text"
id="author"
placeholder="Escribe tu nombre"
>

<label>Comentario</label>
<textarea
id="content"
placeholder="Escribe aquí tu comentario..."
></textarea>

<button onclick="publicar()">
PUBLICAR
</button>

<div id="mensaje"></div>

</div>

<div class="card">

<h2>📋 Publicaciones</h2>

<div id="posts">
Cargando publicaciones...
</div>

</div>

</main>

<script>

// ==========================================
// CONFIGURACIÓN DE SUPABASE
// ==========================================

const SUPABASE_URL =
"https://pudueiuqytyjwainzuua.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VSg8gUX_7Z53EkJq6oLt4g_-v-AvR3b";


// ==========================================
// CARGAR PUBLICACIONES
// ==========================================

async function cargarPublicaciones() {

const respuesta = await fetch(
SUPABASE_URL +
"/rest/v1/posts?select=*&order=created_at.desc",
{
headers: {
"apikey": SUPABASE_KEY,
"Authorization": "Bearer " + SUPABASE_KEY
}
}
);

if (!respuesta.ok) {
document.getElementById("posts").innerHTML =
"No se pudieron cargar las publicaciones.";
return;
}

const publicaciones = await respuesta.json();

const contenedor =
document.getElementById("posts");

if (publicaciones.length === 0) {

contenedor.innerHTML =
"Todavía no hay publicaciones.";

return;
}

contenedor.innerHTML = "";

publicaciones.forEach(publicacion => {

const div = document.createElement("div");

div.className = "post";

const fecha =
new Date(publicacion.created_at)
.toLocaleString("es-ES");

div.innerHTML = `
<strong>${escapeHTML(
publicacion.author_name || "Anónimo"
)}</strong>

<p>${escapeHTML(
publicacion.content
)}</p>

<div class="date">
${fecha}
</div>
`;

contenedor.appendChild(div);

});
}


// ==========================================
// PUBLICAR
// ==========================================

async function publicar() {

const nombre =
document.getElementById("author").value.trim();

const comentario =
document.getElementById("content").value.trim();

const mensaje =
document.getElementById("mensaje");


if (!comentario) {

mensaje.innerText =
"Escribe un comentario.";

return;
}


mensaje.innerText =
"Publicando...";


// ID del departamento Administración
// Lo obtendremos automáticamente
// buscando el departamento por su "Slug".

const departamentoRespuesta =
await fetch(
SUPABASE_URL +
"/rest/v1/departments?"Slug"=eq.administracion&select=id",
{
headers: {
"apikey": SUPABASE_KEY,
"Authorization": "Bearer " + SUPABASE_KEY
}
}
);


if (!departamentoRespuesta.ok) {

mensaje.innerText =
"Error al buscar el departamento.";

return;
}


const departamentos =
await departamentoRespuesta.json();


if (departamentos.length === 0) {

mensaje.innerText =
"No se encontró el departamento.";

return;
}


const departmentId =
departamentos[0].id;


// Crear publicación

const respuesta =
await fetch(
SUPABASE_URL + "/rest/v1/posts",
{
method: "POST",

headers: {
"Content-Type": "application/json",
"apikey": SUPABASE_KEY,
"Authorization": "Bearer " + SUPABASE_KEY,
"Prefer": "return=minimal"
},

body: JSON.stringify({
department_id: departmentId,
author_name: nombre || "Anónimo",
content: comentario
})
}
);


if (!respuesta.ok) {

mensaje.innerText =
"❌ No se pudo publicar.";

return;
}


mensaje.innerText =
"✅ Publicado correctamente.";


document.getElementById("author").value = "";
document.getElementById("content").value = "";


cargarPublicaciones();

}


// ==========================================
// SEGURIDAD
// ==========================================

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent = text;

return div.innerHTML;
}


// ==========================================
// INICIAR
// ==========================================

cargarPublicaciones();

</script>

</body>
</html>
